name: MANDATE checks

on:
  push:
    branches: [main, feat/wallet-connection-ux, feat/recovery-code-reset, feat/phase-2-counterparty-risk]
  pull_request:
    branches: [main, feat/wallet-connection-ux, feat/recovery-code-reset]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Report dependency vulnerabilities
        run: |
          npm audit --json > /tmp/mandate-npm-audit.json || true
          node -e "const a=require('/tmp/mandate-npm-audit.json'); console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities, findings:Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable,via:v.via.map(x=>typeof x==='string'?x:{name:x.name,title:x.title,url:x.url,range:x.range})}))},null,2))"
      - name: Enforce dependency audit
        run: npm audit --audit-level=low
      - name: Run authorization tests
        run: npm test
      - name: Type-check
        run: npm run typecheck
      - name: Build application
        run: npm run build
