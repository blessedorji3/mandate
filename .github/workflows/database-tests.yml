name: MANDATE database integration tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  recovery-database:
    name: Recovery database integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run recovery signature and challenge security tests
        run: deno test --no-check supabase/functions/near-transfer-authorization/recovery-security.test.ts
      - name: Replay migrations and run pgTAP recovery tests
        run: bash .github/scripts/run-recovery-db-tests.sh
