name: MANDATE database integration tests

on:
  push:
    branches: [main, feat/wallet-connection-ux, feat/recovery-code-reset, feat/phase-2-counterparty-risk]
  pull_request:
    branches: [main, feat/wallet-connection-ux, feat/recovery-code-reset]

permissions:
  contents: read

jobs:
  recovery-database:
    name: Recovery database integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install application dependencies for Deno npm resolution
        run: npm install
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check risk-aware inspection and wallet authorization Edge Functions
        run: deno check --node-modules-dir=auto supabase/functions/agent-inspect/index.ts
      - name: Run recovery signature and challenge security tests
        run: deno test supabase/functions/near-transfer-authorization/recovery-security.test.ts
      - name: Run Meteor NEP-413 recovery reset diagnostic
        run: deno test supabase/functions/near-transfer-authorization/recovery-meteor-diagnostic.test.ts
      - name: Run Edge Function HTTP authentication integration tests
        run: deno test --no-check --node-modules-dir=auto --allow-env --allow-net supabase/functions/near-transfer-authorization/http-integration.test.ts
      - name: Run proposal-bound counterparty review HTTP security tests
        run: deno test --no-check --node-modules-dir=auto --allow-env --allow-net supabase/functions/near-transfer-authorization/counterparty-risk-review-integration.test.ts
      - name: Run adversarial recovery HTTP integration tests
        run: deno test --no-check --node-modules-dir=auto --allow-env --allow-net supabase/functions/near-transfer-authorization/recovery-adversarial-integration.test.ts
      - name: Replay migrations and run pgTAP recovery tests
        run: bash .github/scripts/run-recovery-db-tests.sh
